/* ---------- kamera orbit ---------- */
const tgt=new T.Vector3(0,.85,0),ob={th:.1,ph:1.2,r:2.1};let goal=null;
const cv=$('c'),HR=()=>{const a=cv.clientWidth/cv.clientHeight;return Math.max(2.1,Math.min(3.4,2.6/a))};
function zoom(f){ob.r=cl(ob.r*f,.35,4.5)}
function pan(dx,dy){tgt.x=cl(tgt.x+Math.cos(ob.th)*dx,-1.3,1.1);tgt.z=cl(tgt.z-Math.sin(ob.th)*dx,-.6,.8);tgt.y=cl(tgt.y+dy,.4,1.4)}
function go(o){goal=Object.assign({th:ob.th,ph:ob.ph,r:ob.r,x:tgt.x,y:tgt.y,z:tgt.z},o)}
function animGoal(){if(!goal)return;const k=.14;ob.th+=(goal.th-ob.th)*k;ob.ph+=(goal.ph-ob.ph)*k;ob.r+=(goal.r-ob.r)*k;tgt.x+=(goal.x-tgt.x)*k;tgt.y+=(goal.y-tgt.y)*k;tgt.z+=(goal.z-tgt.z)*k;if(Math.abs(goal.r-ob.r)<.003&&Math.abs(goal.th-ob.th)<.003&&Math.abs(goal.ph-ob.ph)<.003&&Math.abs(goal.x-tgt.x)<.003)goal=null}
function setCam(){cam.position.set(tgt.x+ob.r*Math.sin(ob.ph)*Math.sin(ob.th),tgt.y+ob.r*Math.cos(ob.ph),tgt.z+ob.r*Math.sin(ob.ph)*Math.cos(ob.th));cam.lookAt(tgt)}
const P=new Map();let mv=0;
cv.addEventListener('pointerdown',e=>{goal=null;cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button,s:e.shiftKey});if(P.size===1)mv=0});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
 if(P.size===2){const o=[...P.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y),c0x=(p.x+o.x)/2,c0y=(p.y+o.y)/2;p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(p.x-o.x,p.y-o.y);if(d0>0&&d1>0)zoom(d0/d1);const k=ob.r*.0011;pan(-((p.x+o.x)/2-c0x)*k,((p.y+o.y)/2-c0y)*k);mv+=99;return}
 p.x=e.clientX;p.y=e.clientY;mv+=Math.abs(dx)+Math.abs(dy);
 if(p.b===1||p.b===2||p.s){const k=ob.r*.0012;pan(-dx*k,dy*k)}else{ob.th-=dx*.006;ob.ph=cl(ob.ph-dy*.006,.2,1.5)}});
cv.addEventListener('pointerup',e=>P.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>P.delete(e.pointerId));cv.addEventListener('contextmenu',e=>e.preventDefault());

function lay(){const m=innerWidth<900,u=$('ui').getBoundingClientRect(),n=$('nav').getBoundingClientRect(),r=$('rc').getBoundingClientRect();
 const L=m?0:u.right+12,Rr=m?0:innerWidth-r.left+12,Tp=m?n.bottom+6:0,Bt=m?innerHeight-u.top+6:0;

addEventListener('resize',lay);const ro=new ResizeObserver(lay);[$('ui'),$('nav'),$('rc')].forEach(e=>ro.observe(e));lay();

/* ---------- UI ---------- */

nv('zi',()=>zoom(.78));nv('zo',()=>zoom(1.28));nv('pl',()=>pan(-ob.r*.12,0));nv('pr',()=>pan(ob.r*.12,0));nv('pu',()=>pan(0,ob.r*.08));nv('pdn',()=>pan(0,-ob.r*.08));

/* ---------- teks sifat bayangan ---------- */
function sifat(){
 if(op.inf)return{ruang:'Benda di titik fokus (F): sinar keluar sejajar, bayangan di tak hingga.',tx:'bayangan di tak hingga'};
 const real=op.real,M=op.M,nm=real?'nyata':'maya',ori=M<0?'terbalik':'tegak',am=Math.abs(M),sz=Math.abs(am-1)<.02?'sama besar':am>1?'diperbesar':'diperkecil',tx=[nm,ori,sz].join(', ');
 const s=op.s,f=Math.abs(op.f),con=op.f>0;let ruang='';
 if(con){ruang=s>2*f+.01?'Benda di Ruang III (s > 2f): bayangan di Ruang II.':Math.abs(s-2*f)<=.01?'Benda tepat di 2F: bayangan tepat di 2F\'.':s>f?'Benda di Ruang II (f < s < 2f): bayangan di Ruang III.':'Benda di Ruang I (s < f): bayangan maya, seperti lup.'}
 else ruang=op.mir?'Cermin cembung selalu membentuk bayangan maya, tegak, diperkecil.':'Lensa cekung selalu membentuk bayangan maya, tegak, diperkecil.';
 return{ruang,tx}}

/* ---------- diagram sinar & layar ---------- */
function drawAn(){
 const c=$('an'),k=c.getContext('2d'),W=360,H=270;k.setTransform(2,0,0,2,0,0);k.clearRect(0,0,W,H);
 const cs=getComputedStyle(document.documentElement),fg=cs.getPropertyValue('--fg').trim()||'#17212b',ac=cs.getPropertyValue('--ac').trim()||'#0b7285',mut=cs.getPropertyValue('--mut').trim()||'#5f6f7c';
 k.fillStyle=fg;k.font='11px system-ui,sans-serif';k.textAlign='left';k.fillText('Diagram sinar (skala tegak diperbesar)',4,12);
 const F=Math.abs(op.f),xsList=[op.xo,E,E-F,E+F,E-2*F,E+2*F];if(!op.inf)xsList.push(cl(op.xi,E-80,E+80));
 const lo=Math.max(Math.min(...xsList)-4,-40),hi=Math.min(Math.max(...xsList)+4,160),sx=(W-16)/(hi-lo),mx=x=>8+(x-lo)*sx,y0=86,hv=op.inf?0:Math.abs(op.hi),ym=Math.max(op.h,Math.min(hv,12),5.2)*1.1,sy=60/ym,my=y=>y0-y*sy;
 k.save();k.beginPath();k.rect(0,18,W,138);k.clip();
 k.strokeStyle=mut;k.globalAlpha=.55;k.lineWidth=1;k.beginPath();k.moveTo(0,y0);k.lineTo(W,y0);k.stroke();k.globalAlpha=1;
 // titik fokus
 k.font='10px system-ui,sans-serif';k.textAlign='center';const dk=document.documentElement.getAttribute('data-theme')==='dark'||(document.documentElement.getAttribute('data-theme')!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches),hl=dk?'rgba(24,31,36,.92)':'rgba(255,255,255,.92)';
 (op.mir?[[E-op.f,'F'],[E-2*op.f,'C']]:[[E-F,'F'],[E+F,"F'"],[E-2*F,'2F'],[E+2*F,"2F'"]]).forEach(([x,t])=>{if(x<lo||x>hi)return;k.fillStyle=t[0]==='2'||t==='C'?'#1c7ed6':'#f08c00';k.beginPath();k.arc(mx(x),y0,2.6,0,7);k.fill();k.lineWidth=3;k.strokeStyle=hl;k.lineJoin='round';k.strokeText(t,mx(x),y0+14);k.fillText(t,mx(x),y0+14)});
 // elemen
 const ex=mx(E);k.strokeStyle=fg;k.fillStyle=fg;k.lineWidth=1.8;
 if(!op.mir){k.beginPath();k.moveTo(ex,my(5));k.lineTo(ex,my(-5));k.stroke();[[5,-1],[-5,1]].forEach(([y,out])=>{const yy=my(y),tip=op.f>0?yy:yy-out*6,base=op.f>0?yy-out*6:yy;k.beginPath();k.moveTo(ex,tip);k.lineTo(ex-4,base);k.lineTo(ex+4,base);k.closePath();k.fill()})}
 else{const cc=op.f>0?5:-5,Y1=my(5),Y2=my(-5);k.beginPath();k.moveTo(ex-cc,Y1);k.quadraticCurveTo(ex+cc,y0,ex-cc,Y2);k.stroke();k.lineWidth=1;for(let i=0;i<=9;i++){const t=i/9,u=1-t,xx=u*u*(ex-cc)+2*u*t*(ex+cc)+t*t*(ex-cc),yy=u*u*Y1+2*u*t*y0+t*t*Y2;k.beginPath();k.moveTo(xx,yy);k.lineTo(xx+5,yy+4);k.stroke()}}
 // sinar
 const cols=['#e03131','#2f9e44','#1c7ed6'];k.lineWidth=1.3;
 op.rays.forEach(r=>{k.strokeStyle=cols[r.c];k.setLineDash([]);k.beginPath();k.moveTo(mx(r.p0.x),my(r.p0.y));k.lineTo(mx(r.p1.x),my(r.p1.y));k.lineTo(mx(r.p2.x),my(r.p2.y));k.stroke();
  if(r.p3){k.setLineDash([4,3]);k.globalAlpha=.7;k.beginPath();k.moveTo(mx(r.p1.x),my(r.p1.y));k.lineTo(mx(r.p3.x),my(r.p3.y));k.stroke();k.globalAlpha=1;k.setLineDash([])}});
 const arrow=(x,h,col,dash)=>{const X0=mx(x),Y2=my(h),d=h<0?-1:1;k.strokeStyle=col;k.fillStyle=col;k.lineWidth=2.2;k.setLineDash(dash?[3,2]:[]);k.beginPath();k.moveTo(X0,y0);k.lineTo(X0,Y2+d*5);k.stroke();k.setLineDash([]);k.beginPath();k.moveTo(X0,Y2);k.lineTo(X0-3.5,Y2+d*7);k.lineTo(X0+3.5,Y2+d*7);k.closePath();k.fill()};
 arrow(op.xo,op.h,fg,false);if(!op.inf&&Math.abs(op.hi)>.05)arrow(clamp3(op.xi,lo,hi),op.hi,op.real?'#e8590c':'#1c7ed6',!op.real);
 if(op.real&&!op.inf){const sxp=mx(st.xs);k.strokeStyle='#868e96';k.lineWidth=3;k.beginPath();k.moveTo(sxp,my(6));k.lineTo(sxp,my(-6));k.stroke()}
 k.restore();
 // dimensi
 k.font='11px system-ui,sans-serif';k.textAlign='left';k.fillStyle=fg;k.fillText('s = '+fmt(op.s,1)+' cm',4,166);k.textAlign='right';k.fillText(op.inf?"s' → ∞":"s' = "+fmt(op.sp,1)+' cm',W-4,166);k.textAlign='left';
 k.strokeStyle=mut;k.globalAlpha=.4;k.beginPath();k.moveTo(4,172);k.lineTo(W-4,172);k.stroke();k.globalAlpha=1;
 // layar
 k.drawImage(scv,4,176,82,82);k.strokeStyle=mut;k.lineWidth=1;k.strokeRect(4,176,82,82);
 k.fillStyle=mut;k.font='10px system-ui,sans-serif';k.fillText('Tampilan layar',6,268);
 const sf=sifat();k.font='bold 11px system-ui,sans-serif';k.fillStyle=ac;k.fillText(MODES[st.mode].n+' · f = '+(op.f>0?'+':'−')+F+' cm',98,190);
 k.font='11px system-ui,sans-serif';k.fillStyle=fg;k.fillText("1/f = 1/s + 1/s'",98,206);
 k.fillText(fmt(1/op.f,3)+' = '+fmt(1/op.s,3)+' + '+fmt(op.inf?0:1/op.sp,3),98,221);
 k.fillStyle=ac;wrap(k,'Sifat: '+sf.tx,98,238,258,13);
 k.fillStyle=fg;k.font='10px system-ui,sans-serif';wrap(k,focusMsg(),98,262,258,12)}
const clamp3=(v,a,b)=>cl(v,a,b);
function wrap(k,t,x,y,w,lh){const ws=t.split(' ');let l='';ws.forEach(wd=>{const test=l?l+' '+wd:wd;if(k.measureText(test).width>w&&l){k.fillText(l,x,y);y+=lh;l=wd}else l=test});k.fillText(l,x,y)}
function focusMsg(){if(!st.on)return 'Tekan Nyalakan untuk melihat jalannya sinar.';if(op.inf)return 'Tidak ada bayangan di layar.';if(!op.real)return 'Bayangan maya tidak dapat ditangkap layar.';const d=st.xs-op.xi;return Math.abs(d)<.35?'Layar tepat di bayangan: tajam.':'Geser layar '+fmt(Math.abs(d),1)+' cm ke '+((d>0)!==op.mir?'kiri':'kanan')+' agar tajam.'}

/* ---------- loop ---------- */
let last=performance.now(),fr=0;
function frame(now){
 const dt=Math.min((now-last)/1000,.05);last=now;
 if(st.on&&st.p<1)st.p=Math.min(1,st.p+dt*st.spd/3.5);
 setLamp(st.on);drawRays();
 const ia=st.on?Math.round(cl((st.p-.8)/.2,0,1)*20)/20:0;
 if(ia!==curIa||dirty){curIa=ia;drawScreen();dirty=false}
 ghostM.opacity=ghost.userData.ok?ia*.75:0;LB.img.on=ghost.userData.ok&&ia>.5;ghost.visible=ghostM.opacity>.01;coneM.opacity=st.on?.12*cl((st.p-.05)/.45,0,1):0;coneG.visible=coneM.opacity>.002;
 animGoal();setCam();R.render(SC,cam);layLabels();
 if(fr++%3==0){
  $('rt').textContent=fmt(op.s,1);$('rs').textContent=op.inf?'∞':fmt(op.sp,1);$('rv').textContent=op.inf?'–':fmt(op.M);$('ra').textContent=op.inf?'–':fmt(op.hi,1);
  const sf=sifat();$('hint').textContent=sf.ruang+(op.inf?'':' Bayangan '+sf.tx+'.')+(st.on?'':' Tekan Nyalakan.');
  drawAn()}
 requestAnimationFrame(frame)}
if(innerWidth<700)$('ui').classList.add('min');else $('bMore').classList.add('act');showAn(innerWidth>=700);
buildSlide();setMode('lc');ob.r=HR();requestAnimationFrame(frame);
</script></body></html>
